<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Guess The Number</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="game-container">

        <h1>🎯 Guess The Number</h1>

        <div class="game-status">
            {% if session.get("game_over") %}
                🏆 Game Over
            {% else %}
                🎮 Game in progress
            {% endif %}
        </div>

        
        <form method="POST">

            <label for="difficulty">Choose difficulty:</label>
    
            <select name="difficulty" id="difficulty">
                <option value="easy" {% if session.get("difficulty") == "easy" %}selected{% endif %}>
                    Easy
                </option>

                <option value="medium" {% if session.get("difficulty") == "medium" %}selected{% endif %}>
                    Medium
                </option>

                <option value="hard" {% if session.get("difficulty") == "hard" %}selected{% endif %}>
                    Hard
                </option>
            </select>
    
            <p>
                Guess a number between 1 and {{ max_number }}
            </p>
            
            <input
                type="number"
                name="guess"
                min="1"
                max="{{ max_number }}"
                placeholder="Enter your guess"
                required
            >

            <button type="submit">Guess</button>

        </form>

        <div class="message {{ message_type }}">
            {{ message }}
        </div>

        <p class="tries">
            Tries: {{ tries }}/{{ session.get("max_tries") }}
        </p>

        {% if session.get("game_over") %}
            <a href="{{ url_for('reset') }}" class="play-again">
                Play Again 🔄
            </a>
        {% endif %}    

    </div>

</body>
</html>
